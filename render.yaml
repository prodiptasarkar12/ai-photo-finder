services:
  - type: web
    name: ai-photo-finder-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://prodiptasarkar12.github.io/ai-photo-finder
      - key: DATABASE_URL
        fromDatabase:
          name: ai-photo-finder-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 10wRXIJvlNs-w15YRPJ0Mpw60rhylPmW9

databases:
  - name: ai-photo-finder-db
    databaseName: ai_photo_finder
    user: ai_photo_finder
    plan: free
