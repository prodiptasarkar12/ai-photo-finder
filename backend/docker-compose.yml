services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_photo_finder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - postgres
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_photo_finder
      DATABASE_SSL: "false"
      FRONTEND_URL: http://localhost:8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
